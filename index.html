<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- वेबसाइट का नाम -->
  <title>Coding Hub</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Arial,sans-serif;
    }

    body{
      background:#f4f6f8;
      color:#222;
    }

    /* सबसे ऊपर Vicky Coding Hub Banner */
    .banner{
      background:linear-gradient(135deg,#111827,#2563eb);
      color:white;
      padding:25px 15px;
      text-align:center;
    }

    .profile{
      width:80px;
      height:80px;
      border-radius:50%;
      object-fit:cover;
      border:3px solid white;
      margin-bottom:10px;
    }

    .banner h1{
      font-size:30px;
      margin-bottom:7px;
    }

    .banner p{
      font-size:15px;
    }

    /* Search */
    .search-box{
      padding:18px;
      text-align:center;
      background:white;
    }

    .search-box input{
      width:90%;
      max-width:600px;
      padding:13px;
      border:1px solid #ccc;
      border-radius:10px;
      font-size:16px;
    }

    /* Main */
    .container{
      max-width:1000px;
      margin:auto;
      padding:20px;
    }

    .title{
      text-align:center;
      margin:15px 0 20px;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
      gap:15px;
    }

    .card{
      background:white;
      padding:22px 10px;
      border-radius:14px;
      text-align:center;
      box-shadow:0 3px 10px rgba(0,0,0,.08);
      cursor:pointer;
    }

    .card h3{
      margin-bottom:8px;
    }

    /* Code Editor */
    .editor{
      margin-top:30px;
      background:white;
      padding:20px;
      border-radius:14px;
    }

    textarea{
      width:100%;
      height:180px;
      margin-top:12px;
      padding:12px;
      background:#111827;
      color:white;
      border-radius:8px;
      font-family:monospace;
      font-size:14px;
    }

    button{
      margin-top:12px;
      padding:11px 20px;
      border:0;
      border-radius:8px;
      background:#2563eb;
      color:white;
      font-size:16px;
      cursor:pointer;
    }

    iframe{
      width:100%;
      height:200px;
      margin-top:15px;
      border:1px solid #ccc;
      border-radius:8px;
      background:white;
    }

    footer{
      text-align:center;
      padding:25px;
      margin-top:30px;
      background:#111827;
      color:white;
    }
  </style>
<meta name="google-site-verification" content="r1hPv7FiIB3fPgu4C04fb1JJHAqdmo00DrOaYs9yXks" />
  
</head>
<body>

  <!-- ऊपर का बैनर -->
  <header class="banner">

    <!-- अपनी फोटो का नाम यहाँ photo.jpg रखें -->
    <img src="my.photo.jpg" class="profile" alt="Vicky">

    <h1>💻 VICKY CODING HUB</h1>
    <p>आसान हिंदी में Coding सीखें 🚀</p>

  </header>

  <!-- Search -->
  <div class="search-box">
    <input
      type="text"
      id="search"
      placeholder="🔎 Coding खोजें..."
      onkeyup="searchLessons()">
  </div>

  <main class="container">

    <h2 class="title">📚 Coding Lessons</h2>

    <div class="cards" id="lessons">

      <div class="card">
        <h3>🌐 HTML</h3>
        <p>Website बनाना सीखें</p>
      </div>

      <div class="card">
        <h3>🎨 CSS</h3>
        <p>Website Design सीखें</p>
      </div>

      <div class="card">
        <h3>⚡ JavaScript</h3>
        <p>Website में Logic लगाएँ</p>
      </div>

      <div class="card">
        <h3>🐍 Python</h3>
        <p>Programming सीखें</p>
      </div>

      <div class="card">
        <h3>🧠 Quiz</h3>
        <p>Coding Quiz खेलें</p>
      </div>

      <div class="card">
        <h3>💻 Projects</h3>
        <p>Projects बनाना सीखें</p>
      </div>

    </div>

    <!-- Code Editor -->
    <section class="editor">

      <h2>💻 अपना Code चलाएँ</h2>

      <textarea id="code"><h1>Hello Vicky Coding Hub!</h1>
<p>मेरी पहली वेबसाइट 🚀</p></textarea>

      <button onclick="runCode()">▶️ Run Code</button>

      <iframe id="output"></iframe>

    </section>

  </main>

  <footer>
    © 2026 Vicky Coding Hub
  </footer>

  <script>

    function runCode(){
      let code = document.getElementById("code").value;
      document.getElementById("output").srcdoc = code;
    }

    function searchLessons(){

      let input =
        document.getElementById("search")
        .value.toLowerCase();

      let cards =
        document.querySelectorAll(".card");

      cards.forEach(function(card){

        let text =
          card.innerText.toLowerCase();

        card.style.display =
          text.includes(input) ? "block" : "none";

      });
    }

  </script>

</body>
</html>
